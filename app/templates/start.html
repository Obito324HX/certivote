{% extends "base.html" %}
{% block content %}
<div class="card">
  <p>Enter your exam number to see the elections you're eligible to vote in.</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="{{ url_for('voter_ui.start') }}">
    <label for="exam_number">Exam number</label>
    <input type="text" id="exam_number" name="exam_number" required autofocus>
    <button type="submit">Continue</button>
  </form>
</div>
{% endblock %}

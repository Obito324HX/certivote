{% extends "base.html" %}
{% block body_class %}broadcast{% endblock %}
{% block content %}
<div class="card">
  <p>Elections</p>
  {% for e in elections %}
    <div class="election">
      <span>{{ e.name }} <span style="color:rgba(237,239,236,0.55); font-size:0.85rem;">({{ e.status.value }})</span></span>
      <a href="{{ url_for('public_ui.show', election_id=e.id) }}"><button type="button">View</button></a>
    </div>
  {% else %}
    <p>No elections to show yet.</p>
  {% endfor %}
</div>
{% endblock %}

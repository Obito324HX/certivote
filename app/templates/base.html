<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Certivote</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 480px;
           margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
    h1 { font-size: 1.3rem; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 1.25rem; margin-top: 1rem; }
    label { display: block; margin-top: 0.75rem; font-weight: 600; font-size: 0.9rem; }
    input[type=text], input[type=password], input[type=file] {
      width: 100%; padding: 0.6rem; font-size: 1rem; margin-top: 0.25rem;
      box-sizing: border-box; border: 1px solid #bbb; border-radius: 6px;
    }
    button { margin-top: 1rem; padding: 0.6rem 1.2rem; font-size: 1rem; border: none;
             border-radius: 6px; background: #1a1a1a; color: #fff; cursor: pointer; }
    button:hover { background: #333; }
    .error { background: #fdecea; color: #8a1c1c; padding: 0.75rem; border-radius: 6px; margin-top: 1rem; }
    .success { background: #eaf7ea; color: #1c5e20; padding: 0.75rem; border-radius: 6px; margin-top: 1rem; }
    .election { border: 1px solid #ddd; border-radius: 6px; padding: 0.75rem; margin-top: 0.75rem;
                display: flex; justify-content: space-between; align-items: center; }
    .candidate { border: 1px solid #ddd; border-radius: 6px; padding: 0.75rem; margin-top: 0.5rem; }
    .candidate label { display: flex; align-items: center; gap: 0.5rem; font-weight: normal; }
    fieldset { border: 1px solid #ddd; border-radius: 8px; margin-top: 1rem; padding: 0.75rem 1rem; }
    legend { font-weight: 600; padding: 0 0.4rem; }
  </style>
</head>
<body>
  <h1>Certivote</h1>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for m in messages %}<div class="error">{{ m }}</div>{% endfor %}
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</body>
</html>
